spring.application.name=plataforma_crowdfunding_backend
# Conexión a la base de datos.
# Si no hay una BD externa, usa H2 en memoria para que el proyecto pueda arrancar en desarrollo local.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:crowdfunding;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.auth.session-cookie-name=${AUTH_SESSION_COOKIE_NAME:AUTH_SESSION}
app.auth.session-days=${AUTH_SESSION_DAYS:7}
app.auth.remember-days=${AUTH_REMEMBER_DAYS:30}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.oauth.google.token-uri=${GOOGLE_TOKEN_URI:}
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.seed.enabled=${APP_SEED_ENABLED:false}
app.payment.platform-fee-rate=${PAYMENT_PLATFORM_FEE_RATE:0.05}
app.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:development-webhook-secret}

# Puerto del servidor (opcional, 8080 es el default)
server.port=8080